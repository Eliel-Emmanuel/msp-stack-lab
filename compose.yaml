services:
  caddy:
    image: caddy:${CADDY_VERSION}
    restart: unless-stopped
    ports:
      - "127.0.0.1:80:80"
      - "127.0.0.1:443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - donnees-caddy:/data
      - config-caddy:/config
    networks: 
        frontal:
          aliases: [rmm.horizon.lan]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:2019/config/"]
      interval: 15s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 64M
  
  meshcentral:
    image: ghcr.io/ylianst/meshcentral:${MESHCENTRAL_VERSION}
    restart: unless-stopped
    depends_on:
      caddy:
        condition: service_healthy
    volumes:
      - donnees-meshcentral:/opt/meshcentral/meshcentral-data
      - fichiers-meshcentral:/opt/meshcentral/meshcentral-files
      - ./meshcentral/config.json:/opt/meshcentral/meshcentral-data/config.json:ro
    networks: [frontal]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4430/health.ashx"]
      interval: 15s
      retries: 10
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 384M

  mariadb:
    image: mariadb:${MARIADB_VERSION}
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      OSTICKET_DB_PASSWORD: ${OSTICKET_DB_PASSWORD}
      BOOKSTACK_DB_PASSWORD: ${BOOKSTACK_DB_PASSWORD}
    volumes:
      - donnees-mariadb:/var/lib/mysql
      - ./mariadb/init:/docker-entrypoint-initdb.d:ro
    networks: [donnees]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 384M

  mailpit:
    image: axllent/mailpit:${MAILPIT_VERSION}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"
    environment:
      MP_DATABASE: /data/mailpit.db
    volumes:
      - donnees-mailpit:/data
    networks: [frontal]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 15s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 64M

networks:
  frontal: {}
  donnees:
    internal: true

volumes:
  donnees-caddy: {}
  config-caddy: {}
  donnees-mariadb: {}
  donnees-mailpit: {}
  donnees-meshcentral: {}
  fichiers-meshcentral: {}
