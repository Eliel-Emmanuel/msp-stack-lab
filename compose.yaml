services:
  caddy:
    image: caddy:${CADDY_VERSION}
    restart: unless-stopped
    ports:
      - "127.0.0.1:80:80"
      - "127.0.0.1:443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - donnees-caddy:/data
      - config-caddy:/config
    networks: 
        frontal:
          aliases: [rmm.horizon.lan]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:2019/config/"]
      interval: 15s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 64M
  
  meshcentral:
    image: ghcr.io/ylianst/meshcentral:${MESHCENTRAL_VERSION}
    restart: unless-stopped
    depends_on:
      caddy:
        condition: service_healthy
    volumes:
      - donnees-meshcentral:/opt/meshcentral/meshcentral-data
      - fichiers-meshcentral:/opt/meshcentral/meshcentral-files
      - enregistrements-meshcentral:/opt/meshcentral/meshcentral-recordings
      - ./meshcentral/config.json:/opt/meshcentral/meshcentral-data/config.json:ro
    networks: [frontal]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4430/health.ashx"]
      interval: 15s
      retries: 10
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 384M

  osticket:
    image: rinkp/osticket-dockerized:${OSTICKET_VERSION}
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      OST_SECRET_SALT: ${OSTICKET_SECRET_SALT}
      OST_ADMIN_EMAIL: ${OSTICKET_ADMIN_EMAIL}
      OST_ADMIN_PASSWD: ${OSTICKET_ADMIN_PASSWORD}
      OST_DBHOST: mariadb:3306
      OST_DBNAME: osticket
      OST_DBUSER: osticket
      OST_DBPASS: ${OSTICKET_DB_PASSWORD}
      OST_HELPDESK_URL: https://support.horizon.lan/
      OST_TRUSTED_PROXIES: 172.16.0.0/12
      PHP_OPCACHE_MEMORY_CONSUMPTION: 64
    volumes:
      - pieces-jointes-osticket:/var/www/attachments
      - ./osticket/healthcheck.php:/usr/local/bin/healthcheck.php:ro
    networks: [frontal, donnees]
    security_opt: [no-new-privileges:true]
    healthcheck:
      # Test sur 127.0.0.1 sans suivre la redirection HTTPS (voir osticket/healthcheck.php)
      test: ["CMD", "php", "/usr/local/bin/healthcheck.php"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    deploy:
      resources:
        limits:
          memory: 256M

  pont-alertes:
    build:
      context: ./pont-alertes
      args:
        MESHCENTRAL_VERSION: ${MESHCENTRAL_VERSION}
    image: msp/pont-alertes:local
    restart: unless-stopped
    depends_on:
      meshcentral:
        condition: service_healthy
      osticket:
        condition: service_healthy
    environment:
      MESHCENTRAL_TOKEN_USER: ${MESHCENTRAL_TOKEN_USER}
      MESHCENTRAL_TOKEN_PASSWORD: ${MESHCENTRAL_TOKEN_PASSWORD}
      OSTICKET_API_KEY: ${OSTICKET_API_KEY}
      OSTICKET_TOPIC_ID: ${OSTICKET_TOPIC_ID}
      PONT_INTERVALLE_SECONDES: ${PONT_INTERVALLE_SECONDES:-300}
    volumes:
      - etat-pont:/data
    networks:
      frontal:
        ipv4_address: 172.30.10.50
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "python3", "-m", "pont.sante"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: 192M

  mariadb:
    image: mariadb:${MARIADB_VERSION}
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      OSTICKET_DB_PASSWORD: ${OSTICKET_DB_PASSWORD}
      BOOKSTACK_DB_PASSWORD: ${BOOKSTACK_DB_PASSWORD}
    volumes:
      - donnees-mariadb:/var/lib/mysql
      - ./mariadb/init:/docker-entrypoint-initdb.d:ro
    networks: [donnees]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 384M

  mailpit:
    image: axllent/mailpit:${MAILPIT_VERSION}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"
    environment:
      MP_DATABASE: /data/mailpit.db
    volumes:
      - donnees-mailpit:/data
    networks: [frontal]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 15s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 64M

networks:
  frontal:
    ipam:
      config:
        - subnet: 172.30.10.0/24
  donnees:
    internal: true

volumes:
  donnees-caddy: {}
  config-caddy: {}
  donnees-mariadb: {}
  donnees-mailpit: {}
  donnees-meshcentral: {}
  enregistrements-meshcentral: {}
  fichiers-meshcentral: {}
  pieces-jointes-osticket: {}
  etat-pont: {}
